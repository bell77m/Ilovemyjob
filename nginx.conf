# Serves the repo and proxies only the two Ollama calls the page makes, so a
# public tunnel URL works without exposing /api/pull, /api/delete, etc.
server {
  listen 80;
  root /usr/share/nginx/html;

  # The whole repo is mounted: never serve .git, .claude, .remember, .env, ...
  location ~ /\. { return 404; }

  location ~ ^/api/(generate|embed)$ {
    proxy_pass http://ollama:11434;
    proxy_set_header Host localhost;
    proxy_set_header Origin "";   # same-origin call; skip Ollama's CORS check
    proxy_read_timeout 300s;
  }
}
