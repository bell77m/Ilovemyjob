# Hackathon demo: NVIDIA GPU + free public URL (Cloudflare quick tunnel, no account).
#   docker compose -f compose.yaml -f compose.demo.yaml up -d --build
#   docker compose -f compose.yaml -f compose.demo.yaml logs tunnel   # find https://*.trycloudflare.com
# Share <that URL>. Only the app is public; Ollama stays private. URL dies when the laptop sleeps or the tunnel stops.
services:
  ollama:
    gpus: all

  tunnel:
    image: cloudflare/cloudflared:2025.8.1
    depends_on: [web]
    command: tunnel --no-autoupdate --url http://web:3000
