# docker compose up -d --build   then open http://localhost:8000
# Same as REQUIREMENTS.md section 8, no Ollama, Node or Python install needed.
services:
  ollama:
    image: ollama/ollama:0.33.2
    ports: ["11434:11434"]  # for mcp_server.py on the host; the browser never calls Ollama
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20

  # One-shot: pulls models into the shared volume, then exits. Cached after first run.
  pull:
    image: ollama/ollama:0.33.2
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull llama3.2:3b && ollama pull nomic-embed-text"]

  # TanStack Start app (frontend/Dockerfile). Calls Ollama server-side.
  web:
    build: ./frontend
    ports: ["8000:3000"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./prompts.json:/data/prompts.json:ro
      - ./cringe.json:/data/cringe.json:ro

volumes:
  ollama:
